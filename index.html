<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F4EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macros">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Takeaway Macros</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF; --card:#FFFFFF; --ink:#1C1B19; --muted:#6F6B63; --line:#E7E3DA;
  --green:#2F8F5B; --green-bg:#E3F3EA; --amber:#B9730A; --amber-bg:#FBF0DC; --red:#C2410C; --red-bg:#FCE8DD;
  --p:#3B82C4; --c:#E3A43B; --f:#D2604B; --na:#7A6FB0; --fib:#4E9A6B;
  --nav-h:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}
.title-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
h1{font-size:22px;font-weight:800;margin:0;letter-spacing:-.02em}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.search-row{display:flex;gap:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px;height:44px}
.search input{flex:1;border:0;outline:0;font:inherit;font-size:16px;background:none;min-width:0}
.filter-btn{position:relative;width:44px;height:44px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.filter-btn .dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#7EE2A8;display:none}
.filter-btn.on .dot{display:block}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;margin:0 -16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
main{padding:4px 16px}
.meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin:6px 2px 10px}
.meta select{font:inherit;font-size:13px;font-weight:600;border:0;background:none;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;cursor:pointer}
.badge{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px;line-height:1}
.card-body{flex:1;min-width:0}
.card-top{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:700;font-size:15px;line-height:1.25}
.chain{font-size:12px;color:var(--muted);margin-top:2px}
.heart{flex:none;width:36px;height:36px;margin:-6px -6px 0 0;display:grid;place-items:center;border-radius:50%}
.heart svg{width:20px;height:20px}
.heart.on svg{fill:#E0475B;stroke:#E0475B}
.row2{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.pill{font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:999px;white-space:nowrap}
.pill.g{background:var(--green-bg);color:var(--green)}
.pill.a{background:var(--amber-bg);color:var(--amber)}
.pill.r{background:var(--red-bg);color:var(--red)}
.src{font-size:10.5px;font-weight:700;padding:3px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.src.o{border-color:#BFE1CC;color:var(--green)}
.kcal{font-size:13px;font-weight:700}
.kcal span{color:var(--muted);font-weight:500}
.macros{display:flex;gap:10px;margin-top:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.macros b{color:var(--ink);font-weight:700}
.m-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.bar{display:flex;height:6px;border-radius:999px;overflow:hidden;margin-top:8px;background:var(--line)}
.bar i{display:block;height:100%}
.empty{text-align:center;color:var(--muted);padding:48px 20px;line-height:1.5}
.empty .big{font-size:40px;margin-bottom:8px}
.section-h{font-size:17px;font-weight:800;margin:18px 2px 4px}
.section-p{font-size:13px;color:var(--muted);margin:0 2px 10px;line-height:1.5}

/* chain grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-align:center;line-height:1.2}
.tile .badge{width:48px;height:48px;font-size:26px;border-radius:14px}
.at-head{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-top:6px}
.at-head .grow{flex:1}
.at-head b{font-size:17px}
.link-btn{font-size:13px;font-weight:700;color:var(--ink);padding:8px 10px;border-radius:10px;background:var(--bg)}

/* summary card */
.sum{background:var(--ink);color:#fff;border-radius:20px;padding:16px;margin-top:8px}
.sum .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.sum .big{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sum .unit{font-size:13px;opacity:.7;margin-top:4px}
.sum .pill{background:rgba(255,255,255,.14);color:#fff}
.sum .pill.g{background:#7EE2A8;color:#0f3d24}
.sum .pill.a{background:#F7CF7F;color:#4a2f00}
.sum .pill.r{background:#F5A383;color:#4a1500}
.sum-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:14px}
.sum-grid div{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 4px;text-align:center;font-size:11px;opacity:.95}
.sum-grid b{display:block;font-size:15px;margin-bottom:2px}
.meter{margin-top:12px;font-size:12px;opacity:.9}
.meter .track{height:6px;background:rgba(255,255,255,.15);border-radius:4px;overflow:hidden;margin-top:4px}
.meter .track i{display:block;height:100%;border-radius:4px}
.line{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.line .badge{width:36px;height:36px;font-size:18px;border-radius:10px}
.line .grow{flex:1;min-width:0}
.line .nm{font-weight:700;font-size:14px}
.line .tw{font-size:12px;color:var(--green);margin-top:2px}
.line .cl{font-weight:700;font-size:13px;white-space:nowrap}
.x{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--muted);flex:none}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--muted);position:relative}
.nav-btn svg{width:24px;height:24px}
.nav-btn.active{color:var(--ink)}
.nav-btn.active::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--ink)}
.nav-count{position:absolute;top:7px;left:calc(50% + 5px);background:#E0475B;color:#fff;font-size:10px;font-weight:700;min-width:16px;height:16px;border-radius:8px;display:none;place-items:center;padding:0 4px}
.nav-count.green{background:var(--green)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(20,18,15,.4);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;max-height:90vh;overflow-y:auto}
.sheet.show{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px}
.sheet h2{font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.f-group{margin:18px 0}
.f-label{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.f-label span{color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg .chip{min-height:34px}
input[type=range]{width:100%;accent-color:var(--ink)}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer}
.toggle-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.sw-t{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw-t::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.sw-t.on{background:var(--green)}
.sw-t.on::after{transform:translateX(18px)}
.sheet-actions{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;min-height:48px;border-radius:14px;font-weight:700;font-size:15px;padding:0 14px}
.btn.dark{background:var(--ink);color:#fff}
.btn.light{background:var(--bg);border:1px solid var(--line)}
.btn.green{background:var(--green);color:#fff}

/* detail */
.d-head{display:flex;gap:12px;align-items:center}
.d-kcal{display:flex;align-items:baseline;gap:6px;margin:16px 0 6px;flex-wrap:wrap}
.d-kcal b{font-size:40px;font-weight:800;letter-spacing:-.03em}
.d-kcal span{color:var(--muted);font-size:14px}
.ring-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.ring{background:var(--bg);border-radius:16px;padding:12px 8px;text-align:center}
.ring svg{width:60px;height:60px}
.ring .v{font-weight:800;font-size:17px;margin-top:4px}
.ring .l{font-size:12px;color:var(--muted)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.stat{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:12px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:16px;margin-top:2px}
.why{background:var(--bg);border-radius:16px;padding:14px;font-size:14px;line-height:1.5;margin-top:10px}
.why h3{font-size:12px;margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tw-chip{min-height:36px;padding:0 12px;border-radius:999px;border:1px dashed #C9C3B6;background:var(--card);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0}
.tw-chip.on{border-style:solid;border-color:var(--green);background:var(--green-bg);color:var(--green)}
.delta{font-size:12px;color:var(--muted);font-weight:600}
.about p, .about li{font-size:14px;line-height:1.6;color:#3a3833}
.about ol{padding-left:20px}
.legend-row{display:flex;gap:10px;align-items:flex-start;margin:10px 0;font-size:14px;line-height:1.45}
.disclaimer{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:16px;line-height:1.5}
.src-list{font-size:13px;line-height:1.5;margin:0;padding:0;list-style:none}
.src-list li{padding:8px 0;border-bottom:1px solid var(--line)}
.src-list a{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:all .2s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <div>
        <h1 id="pageTitle">Takeaway Macros</h1>
        <div class="sub" id="pageSub">Find the healthier order, fast</div>
      </div>
    </div>
    <div class="search-row" id="searchRow">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6F6B63" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search menu items" autocomplete="off">
      </label>
      <button class="filter-btn" id="filterBtn" aria-label="Filters">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
        <span class="dot"></span>
      </button>
    </div>
    <div class="chips" id="chainChips"></div>
  </header>
  <main id="main"></main>
</div>

<nav>
  <div class="nav-inner">
    <button class="nav-btn active" data-tab="at">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>I'm at…
    </button>
    <button class="nav-btn" data-tab="browse">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18M5 11a7 7 0 0 1 14 0"/><path d="M4 15h16l-1.5 4h-13z"/></svg>Browse
    </button>
    <button class="nav-btn" data-tab="meal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16l-1.5 12a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>Meal<span class="nav-count green" id="mealCount"></span>
    </button>
    <button class="nav-btn" data-tab="favs">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Favourites<span class="nav-count" id="favCount"></span>
    </button>
    <button class="nav-btn" data-tab="about">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>Guide
    </button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>

<div class="sheet" id="filterSheet" role="dialog" aria-label="Filters">
  <div class="grab"></div>
  <h2>Filters</h2>
  <div class="f-group"><div class="f-label">Health rating</div><div class="seg" id="fRating"></div></div>
  <div class="f-group"><div class="f-label">Type</div><div class="seg" id="fType"></div></div>
  <div class="f-group"><div class="f-label">Max calories <span id="calOut"></span></div><input type="range" id="fCal" min="100" max="1100" step="50"></div>
  <div class="f-group"><div class="f-label">Min protein <span id="proOut"></span></div><input type="range" id="fPro" min="0" max="60" step="5"></div>
  <div class="f-group"><div class="f-label">Max sodium <span id="naOut"></span></div><input type="range" id="fNa" min="200" max="2600" step="100"></div>
  <div class="f-group">
    <div class="toggle-row" data-toggle="lowCarb"><div>Low carb<small>Under 20 g carbs</small></div><div class="sw-t"></div></div>
    <div class="toggle-row" data-toggle="lowFat"><div>Lower fat<small>Under 15 g fat</small></div><div class="sw-t"></div></div>
    <div class="toggle-row" data-toggle="hiFib"><div>Good fibre<small>4 g or more</small></div><div class="sw-t"></div></div>
    <div class="toggle-row" data-toggle="veg"><div>Vegetarian<small>No meat</small></div><div class="sw-t"></div></div>
    <div class="toggle-row" data-toggle="checked"><div>Checked figures only<small>Official or database sources</small></div><div class="sw-t"></div></div>
  </div>
  <div class="sheet-actions">
    <button class="btn light" id="resetF">Reset</button>
    <button class="btn dark" id="applyF">Show results</button>
  </div>
</div>

<div class="sheet" id="detailSheet" role="dialog" aria-label="Item details"></div>
<div class="toast" id="toast"></div>

<script>
// ================= DATA =================
const CHAINS = {
  subway:  {name:"Subway",         icon:"🥖", color:"#DCEFE2"},
  nandos:  {name:"Nando's",        icon:"🌶️", color:"#F8DCD8"},
  mcd:     {name:"McDonald's",     icon:"🍟", color:"#FBEBC4"},
  gyg:     {name:"Guzman y Gomez", icon:"🌮", color:"#E8DDF3"},
  grilld:  {name:"Grill'd",        icon:"🍔", color:"#DDE9D3"},
  zamb:    {name:"Zambrero",       icon:"🌯", color:"#F6E2CF"},
  rolld:   {name:"Roll'd",         icon:"🥢", color:"#E1EEDB"},
  fishbowl:{name:"Fishbowl",       icon:"🥗", color:"#D8ECEE"},
  soul:    {name:"Soul Origin",    icon:"🥙", color:"#EFE6D6"},
  noodle:  {name:"Noodle Box",     icon:"🍜", color:"#F7E0D2"},
  oporto:  {name:"Oporto",         icon:"🐔", color:"#FADBD3"},
  hj:      {name:"Hungry Jack's",  icon:"👑", color:"#F7E3CE"},
  kfc:     {name:"KFC",            icon:"🍗", color:"#F5D9DB"},
  rooster: {name:"Red Rooster",    icon:"🐓", color:"#F9DCDC"},
  schnitz: {name:"Schnitz",        icon:"🍋", color:"#FAF0C8"},
  dominos: {name:"Domino's",       icon:"🍕", color:"#D9E4F2"},
  pizzahut:{name:"Pizza Hut",      icon:"🧀", color:"#F4DED6"},
  bettys:  {name:"Betty's Burgers",icon:"🍦", color:"#E3EEF5"},
  boost:   {name:"Boost Juice",    icon:"🥤", color:"#F3E1EE"},
  starbucks:{name:"Starbucks",     icon:"☕", color:"#DCEBE3"},
  zarraffas:{name:"Zarraffa's Coffee",icon:"🧊", color:"#E2E8F4"},
  gongcha: {name:"Gong Cha",       icon:"🧋", color:"#F1E6DA"},
  cafe63:  {name:"Cafe 63",        icon:"🍳", color:"#FBEFD9"},
  rashays: {name:"Rashays",        icon:"🥩", color:"#EADFD7"},
};
const CAFE = new Set(["boost","starbucks","zarraffas","gongcha","cafe63","hj"]);

// Where the figures come from (shown in the Guide)
const SOURCES = {
  subway:  ["o","Subway Australia nutrition information (May 2026 guide)","https://www.subway.com/en-AU/MenuNutrition/Nutrition"],
  nandos:  ["o","Nando's Australia menu pages (every item on nandos.com.au/menu-item)","https://www.nandos.com.au/menu-item"],
  gyg:     ["o","Guzman y Gomez Nutrition & Allergen Guide (8 October 2026)","https://www.guzmanygomez.com.au/wp-content/uploads/2026/10/261008_NUTRITION_ALLERGEN_GUIDE_420X297MM.pdf"],
  zamb:    ["o","Zambrero Nutritional Information AUS (April 2026, no sauce; fibre not published)","https://dph95f73vdxmz.cloudfront.net/uploads/ops/resources/Zambrero-Nutritional-AUS-APRIL-2026.pdf"],
  grilld:  ["d","FatSecret Australia listings","https://www.fatsecret.com.au/calories-nutrition/grilld/simply-grilld/1-burger"],
  hj: ["o","Hungry Jack's nutrition guides (Nov 2026)","https://www.hungryjacks.com.au/nutrition-info"],
  kfc: ["d","Energy from KFC's Nutrition & Allergen Guide; protein, carbs & fat from FatSecret AU","https://www.kfc.com.au/nutrition-allergen"],
  oporto: ["d","FatSecret Australia listings (Oporto's menu figures only load in their app)","https://www.oporto.com.au/menu/"],

const ITEMS = RAW.map(([id,chain,name,type,cal,p,c,f,fib,na,veg,src,tw,tip])=>{
  const it={id,chain,name,type,cal,p,c,f,fib,na,veg:!!veg,src,tw,tip};
  finish(it); return it;
});
const BY_ID = Object.fromEntries(ITEMS.map(i=>[i.id,i]));

function finish(it){
  it.ppc = it.cal? +(it.p/it.cal*100).toFixed(1) : 0;
  it.rating = rate(it);
  return it;
}
function rate(it){
  const DOWN = {g:"a",a:"r",r:"r"};
  if (it.type==="Drink") return (it.cal<=60 || (it.p>=10 && it.cal<=250)) ? "g" : (it.cal<=250 || (it.p>=20 && it.cal<=520)) ? "a" : "r";
  const fatPct = it.cal? it.f*9/it.cal : 0;
  let r;
  if (it.type==="Side") r = (it.cal<=180 && fatPct<=0.4) ? "g" : it.cal<=300 ? "a" : "r";
  else if (it.cal<=450 && fatPct<=0.35 && (it.ppc>=5 || it.cal<=250)) r="g";
  else if (it.cal<=600 && fatPct<=0.45) r="a";
  else r="r";
  if (it.na!=null && ((it.type!=="Side" && it.na>1500) || (it.type==="Side" && it.na>600))) r = DOWN[r];
  return r;
}
const RATING_LABEL = {g:"Healthy pick", a:"Moderate", r:"Treat"};
const ORDER = {g:0,a:1,r:2};

function applyTweaks(base, tw){
  if(!tw || !tw.length) return base;
  const m = {...base};
  tw.forEach(k=>{ const d=TWEAKS[k].fn?TWEAKS[k].fn(m):TWEAKS[k].d;
    m.cal+=d[0]; m.p+=d[1]; m.c+=d[2]; m.f+=d[3];
    if(m.fib!=null) m.fib+=d[4]; if(m.na!=null) m.na+=d[5]; });
  ["cal","p","c","f","fib","na"].forEach(k=>{ if(m[k]!=null) m[k]=Math.max(0,Math.round(m[k]*10)/10); });
  m.cal=Math.round(m.cal); if(m.na!=null) m.na=Math.round(m.na);
  return finish(m);
}

function macroBar(it){

  return `<div class="bar"><i style="width:${pc/t*100}%;background:var(--p)"></i><i style="width:${cc/t*100}%;background:var(--c)"></i><i style="width:${fc/t*100}%;background:var(--f)"></i></div>`;
}

function card(it){

        <span>Na <b>${it.na==null?"—":it.na+"mg"}</b></span>
        <span>Fib <b>${it.fib==null?"—":fmt(it.fib)+"g"}</b></span>
      </div>
      ${it.cal?macroBar(it):""}
    </div>
  </div>`;
}

function filtersActive(f){ return Object.keys(DEFAULT_F).some(k=>f[k]!==DEFAULT_F[k]); }
function applyAll(list, f=filters, useFilters=true){
  const q=query.trim().toLowerCase();
  return list.filter(it=>{
    if (chain!=="all" && it.chain!==chain) return false;
    if (q && !(it.name.toLowerCase().includes(q) || CHAINS[it.chain].name.toLowerCase().includes(q))) return false;
    if (!useFilters) return true;
    if (f.rating!=="all" && it.rating!==f.rating) return false;
    if (f.type!=="all" && it.type!==f.type) return false;
    if (it.cal>f.maxCal) return false;
    if (it.p<f.minPro) return false;
    if (f.maxNa<2600 && it.na!=null && it.na>f.maxNa) return false;
    if (f.lowCarb && it.c>=20) return false;
    if (f.lowFat && it.f>=15) return false;
    if (f.hiFib && !(it.fib!=null && it.fib>=4)) return false;
    if (f.veg && !it.veg) return false;
    if (f.checked && it.src==="e") return false;
    return true;
  });
}
function sortList(list, s=sort){
  const l=[...list];
  const naV=i=>i.na==null?99999:i.na;
  if (s==="health") l.sort((a,b)=>ORDER[a.rating]-ORDER[b.rating] || b.ppc-a.ppc);
  if (s==="cal") l.sort((a,b)=>a.cal-b.cal);
  if (s==="protein") l.sort((a,b)=>b.p-a.p);
  if (s==="ppc") l.sort((a,b)=>b.ppc-a.ppc);
  if (s==="na") l.sort((a,b)=>naV(a)-naV(b));
  return l;
}
function sortSelect(){
  const o=[["health","Healthiest first"],["cal","Lowest calories"],["protein","Most protein"],["ppc","Protein per calorie"],["na","Lowest sodium"]];
  return `<select id="sortSel" aria-label="Sort">${o.map(([v,l])=>`<option value="${v}"${sort===v?" selected":""}>${l}</option>`).join("")}</select>`;
}

// ---- meal totals ----
function lineItem(l){ return applyTweaks(BY_ID[l.id], l.tw); }
function totals(lines){
  const t={cal:0,p:0,c:0,f:0,fib:0,na:0,fibMissing:false,naMissing:false};
  lines.forEach(m=>{ t.cal+=m.cal; t.p+=m.p; t.c+=m.c; t.f+=m.f;
    if(m.fib==null) t.fibMissing=true; else t.fib+=m.fib;
    if(m.na==null) t.naMissing=true; else t.na+=m.na; });
  const fatPct = t.cal? t.f*9/t.cal : 0;
  t.rating = (t.cal<=700 && fatPct<=0.35 && t.na<=1500 && (t.p>=25)) ? "g" : (t.cal<=1000 && t.na<=2300) ? "a" : "r";
  return t;
}
function summaryCard(t, label){
  const pct=(v,max)=>Math.min(100,Math.round(v/max*100));
  return `<div class="sum">
    <div class="top"><div><div class="big">${Math.round(t.cal)}</div><div class="unit">cal · ${kj(t.cal)} kJ · ${pct(t.cal,DAY.cal)}% of a day</div></div><span class="pill ${t.rating}">${label||RATING_LABEL[t.rating]}</span></div>
    <div class="sum-grid">
      <div><b>${fmt(t.p)}g</b>Protein</div><div><b>${fmt(t.c)}g</b>Carbs</div><div><b>${fmt(t.f)}g</b>Fat</div>
      <div><b>${fmt(t.fib)}g${t.fibMissing?"+":""}</b>Fibre</div><div><b>${Math.round(t.na)}${t.naMissing?"+":""}</b>mg Na</div>
    </div>
    <div class="meter">Sodium ${pct(t.na,DAY.na)}% of the 2,000 mg daily target${t.naMissing?" (some items unknown)":""}<div class="track"><i style="width:${pct(t.na,DAY.na)}%;background:${t.na>DAY.na*0.75?"#F5A383":t.na>DAY.na*0.5?"#F7CF7F":"#7EE2A8"}"></i></div></div>
    <div class="meter">Fibre ${pct(t.fib,DAY.fib)}% of 30 g a day${t.fibMissing?" (some items unknown)":""}<div class="track"><i style="width:${pct(t.fib,DAY.fib)}%;background:#7EE2A8"></i></div></div>
  </div>`;
}

function bestFor(k){
  const items=ITEMS.filter(i=>i.chain===k);
  const best=(type)=>sortList(items.filter(i=>i.type===type),"health");
  let mains=sortList(items.filter(i=>i.type==="Main"||i.type==="Breakfast"),"health").slice(0,3);
  if(!mains.length) return {mains:[], side:null, drink:null, drinks:best("Drink").slice(0,5)};
  const side=best("Side")[0]||null;
  const drink=best("Drink")[0]||null;
  return {mains,side,drink};
}

  }

  if (tab==="about"){
    const srcRows=Object.entries(SOURCES).map(([k,[s,label,url]])=>`<li>${CHAINS[k].icon} <b>${CHAINS[k].name}</b> <span class="src ${s}">${SRC_LABEL[s]}</span><br><span style="color:var(--muted)">${esc(label)}</span>${url?` — <a href="${url}" target="_blank" rel="noopener">source</a>`:""}</li>`).join("");
    m.innerHTML=`<div class="about">
      <div class="section-h">How items are rated</div>
      <div class="legend-row"><span class="pill g">Healthy pick</span><div>Mains ≤450 cal, fat ≤35% of calories and good protein (≥5 g per 100 cal). Sides ≤180 cal. Drinks ≤10 cal.</div></div>
      <div class="legend-row"><span class="pill a">Moderate</span><div>Mains up to 600 cal with fat ≤45%. Fine some of the time.</div></div>
      <div class="legend-row"><span class="pill r">Treat</span><div>Over 600 cal or fat-heavy. Enjoy occasionally, or share.</div></div>
      <p>Very salty items drop one level: mains over 1,500 mg sodium, sides over 600 mg. Tweaks you choose (like no cheese) recalculate the rating.</p>
      <div class="section-h">Sodium & fibre</div>
      <p>Australian guidelines suggest keeping sodium to about <b>2,000 mg a day</b> and aiming for <b>25–30 g of fibre</b>. Many takeaway mains use half your sodium in one go. “—” means the chain doesn't publish that figure.</p>
      <div class="section-h">Where the numbers come from</div>
      <p><span class="src o">Official</span> chain's own nutrition info · <span class="src d">Database</span> Australian nutrition databases (FatSecret / CalorieKing), which compile chain data · <span class="src e">Estimate</span> my best estimate — check before relying on it. Tweak adjustments are always estimates.</p>
      <ul class="src-list">${srcRows}</ul>
      <div class="section-h">Install as an app</div>
      <ol><li>Open the app's link on your phone.</li>
      <li><b>iPhone:</b> Safari → Share → <b>Add to Home Screen</b>. <b>Android:</b> Chrome → ⋮ → <b>Install app</b>.</li></ol>
      <p>It then opens full-screen with its own icon, and works offline after the first visit.</p>
      <div class="disclaimer"><b>Note:</b> General guidance only. Menus, recipes and portions change, and your custom order will differ — check each chain's official nutrition info for exact numbers. 1 cal (kcal) = 4.184 kJ; the average adult daily intake used here is 8,700 kJ.</div>
    </div>`;
  }
  updateBadges();
}

function ring(val,max,color){
  const r=24, C=2*Math.PI*r, pct=Math.min(val/max,1);
  return `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="#E7E3DA" stroke-width="7"/><circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 30 30)"/></svg>`;
}

function renderDetail(){
  const base=BY_ID[detail.id], tw=[...detail.tw], it=applyTweaks(base,tw), ch=CHAINS[it.chain];
  const pc=it.p*4, cc=it.c*4, fc=it.f*9, t=(pc+cc+fc)||1;
  const swap = sortList(ITEMS.filter(i=>i.chain===it.chain && i.type===it.type && i.id!==it.id && ORDER[i.rating]<ORDER[it.rating]),"ppc")[0];
  const delta = it.cal-base.cal;
  $("#detailSheet").innerHTML = `<div class="grab"></div>
    <div class="d-head">
      <div class="badge" style="background:${ch.color}">${ch.icon}</div>
      <div style="flex:1"><h2>${esc(it.name)}</h2><div class="chain">${ch.name} · ${it.type} · <span class="src ${it.src}">${SRC_LABEL[it.src]}</span></div></div>
      <button class="heart ${favs.has(it.id)?"on":""}" data-fav="${it.id}" aria-label="Favourite">${heartSvg}</button>
    </div>
    <div class="d-kcal"><b>${it.cal}</b><span>cal · ${kj(it.cal)} kJ</span>${delta?`<span class="delta">(${delta>0?"+":""}${delta} from tweaks)</span>`:""}<span class="pill ${it.rating}" style="margin-left:auto">${RATING_LABEL[it.rating]}</span></div>
    ${it.cal?macroBar(it):""}
    <div class="ring-row">
      <div class="ring">${ring(it.p,60,"var(--p)")}<div class="v">${fmt(it.p)}g</div><div class="l">Protein · ${Math.round(pc/t*100)}%</div></div>
      <div class="ring">${ring(it.c,100,"var(--c)")}<div class="v">${fmt(it.c)}g</div><div class="l">Carbs · ${Math.round(cc/t*100)}%</div></div>
      <div class="ring">${ring(it.f,50,"var(--f)")}<div class="v">${fmt(it.f)}g</div><div class="l">Fat · ${Math.round(fc/t*100)}%</div></div>
    </div>
    <div class="stat-grid">
      <div class="stat">Sodium<b>${it.na==null?"Not published":it.na+" mg · "+Math.round(it.na/DAY.na*100)+"%"}</b></div>
      <div class="stat">Fibre<b>${it.fib==null?"Not published":fmt(it.fib)+" g"}</b></div>
      <div class="stat">Protein per 100 cal<b>${it.ppc} g</b></div>
      <div class="stat">Of an 8,700 kJ day<b>${Math.round(kj(it.cal)/DAY.kj*100)}%</b></div>
    </div>
    ${base.tw.length?`<div class="why"><h3>Customise</h3>${base.tw.map(k=>{const d=TWEAKS[k].fn?TWEAKS[k].fn(base):TWEAKS[k].d;return `<button class="tw-chip ${detail.tw.has(k)?"on":""}" data-tw="${k}">${detail.tw.has(k)?"✓ ":""}${TWEAKS[k].l} <span class="delta">${d[0]>0?"+":""}${d[0]}</span></button>`;}).join("")}<div class="delta" style="margin-top:4px">Tweak values are estimates.</div></div>`:""}
    <div class="why"><h3>Make it healthier</h3>${esc(it.tip)}</div>
    ${swap?`<div class="why"><h3>Healthier swap at ${esc(ch.name)}</h3><button data-open="${swap.id}" style="text-align:left;width:100%"><b>${esc(swap.name)}</b> — ${swap.cal} cal, ${fmt(swap.p)} g protein <span class="pill ${swap.rating}">${RATING_LABEL[swap.rating]}</span></button></div>`:""}
    <div class="sheet-actions"><button class="btn light" data-close>Close</button><button class="btn green" id="addMeal">Add to meal</button></div>`;
}
function openDetail(id, tw=[]){ detail={id, tw:new Set(tw)}; renderDetail(); openSheet("#detailSheet"); }

// ================= SHEETS =================
let openId=null;
function openSheet(sel){ document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("show")); openId=sel; $(sel).classList.add("show"); $("#scrim").classList.add("show"); $(sel).scrollTop=0; }
function closeSheets(){ document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("show")); $("#scrim").classList.remove("show"); openId=null; detail=null; render(); }

function renderFilterSheet(){
  const seg=(el,key,opts)=>{ $(el).innerHTML=opts.map(([v,l])=>`<button class="chip ${draft[key]===v?"active":""}" data-f="${key}" data-v="${v}">${l}</button>`).join(""); };
  seg("#fRating","rating",[["all","All"],["g","Healthy"],["a","Moderate"],["r","Treat"]]);
  seg("#fType","type",[["all","All"],["Main","Mains"],["Side","Sides"],["Breakfast","Breakfast"],["Drink","Drinks"]]);
  $("#fCal").value=draft.maxCal; $("#calOut").textContent=draft.maxCal>=1100?"Any":`≤ ${draft.maxCal} cal`;
  $("#fPro").value=draft.minPro; $("#proOut").textContent=draft.minPro?`≥ ${draft.minPro} g`:"Any";
  $("#fNa").value=draft.maxNa; $("#naOut").textContent=draft.maxNa>=2600?"Any":`≤ ${draft.maxNa} mg`;
  document.querySelectorAll("[data-toggle]").forEach(r=>r.querySelector(".sw-t").classList.toggle("on",!!draft[r.dataset.toggle]));
  const n=applyAll(ITEMS,draft).length; $("#applyF").textContent=`Show ${n} result${n===1?"":"s"}`;
}

// ================= EVENTS =================
function setTab(t){ tab=t; $("#q").value = t==="at" ? atQuery : query; document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===t)); render(); window.scrollTo({top:0}); }

document.addEventListener("click",e=>{
  const fav=e.target.closest("[data-fav]");
  if(fav){ e.stopPropagation(); const id=fav.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); store.set("tm_favs",[...favs]);
    document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>b.classList.toggle("on",favs.has(id)));
    if(tab==="favs" && !openId) render(); else updateBadges(); return; }
  const tw=e.target.closest("[data-tw]"); if(tw&&detail){ const k=tw.dataset.tw; detail.tw.has(k)?detail.tw.delete(k):detail.tw.add(k); const st=$("#detailSheet").scrollTop; renderDetail(); $("#detailSheet").scrollTop=st; return; }
  if(e.target.closest("#addMeal")&&detail){ meal.push({id:detail.id, tw:[...detail.tw]}); saveMeal(); toast("Added to meal ✓"); closeSheets(); return; }
  const op=e.target.closest("[data-open]"); if(op){ openDetail(op.dataset.open); return; }
  const ol=e.target.closest("[data-openline]"); if(ol){ const l=meal[+ol.dataset.openline]; openDetail(l.id,l.tw); return; }
  const rm=e.target.closest("[data-rm]"); if(rm){ meal.splice(+rm.dataset.rm,1); saveMeal(); render(); return; }
  if(e.target.closest("#clearMeal")){ meal=[]; saveMeal(); render(); return; }
  const ac=e.target.closest("[data-addcombo]"); if(ac){ ac.dataset.addcombo.split(",").forEach(id=>meal.push({id,tw:[]})); saveMeal(); toast("Combo added to meal ✓"); return; }
  const at=e.target.closest("[data-at]"); if(at){ atChain=at.dataset.at||null; atQuery=""; $("#q").value=""; store.set("tm_at",atChain); render(); window.scrollTo({top:0}); return; }
  const fm=e.target.closest("[data-fullmenu]"); if(fm){ chain=fm.dataset.fullmenu; renderChips(); setTab("browse"); return; }
  const ch=e.target.closest("[data-chain]"); if(ch){ chain=ch.dataset.chain; renderChips(); render(); return; }
  const nb=e.target.closest(".nav-btn"); if(nb){ setTab(nb.dataset.tab); return; }
  const fs=e.target.closest("[data-f]"); if(fs){ draft[fs.dataset.f]=fs.dataset.v; renderFilterSheet(); return; }
  const tg=e.target.closest("[data-toggle]"); if(tg){ const k=tg.dataset.toggle; draft[k]=!draft[k]; renderFilterSheet(); return; }
  if(e.target.closest("[data-close]")){ closeSheets(); return; }
});
$("#scrim").addEventListener("click",closeSheets);
$("#filterBtn").addEventListener("click",()=>{ draft={...filters}; renderFilterSheet(); openSheet("#filterSheet"); });
$("#fCal").addEventListener("input",e=>{ draft.maxCal=+e.target.value; renderFilterSheet(); });
$("#fPro").addEventListener("input",e=>{ draft.minPro=+e.target.value; renderFilterSheet(); });
$("#fNa").addEventListener("input",e=>{ draft.maxNa=+e.target.value; renderFilterSheet(); });
$("#resetF").addEventListener("click",()=>{ draft={...DEFAULT_F}; renderFilterSheet(); });
$("#applyF").addEventListener("click",()=>{ filters={...draft}; store.set("tm_filters",filters); closeSheets(); });
$("#q").addEventListener("input",e=>{ if(tab==="at") atQuery=e.target.value; else query=e.target.value; render(); });
document.addEventListener("change",e=>{ if(e.target.id==="sortSel"){ sort=e.target.value; store.set("tm_sort",sort); render(); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&openId) closeSheets(); if(e.key==="Enter"){ const c=e.target.closest&&e.target.closest(".card"); if(c) openDetail(c.dataset.open);} });

renderChips(); render();
if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{})); }
</script>
</body>
</html>
